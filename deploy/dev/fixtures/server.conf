management 0.0.0.0 2080

port 1194
proto udp
dev tun

ca pki/ca.crt
cert pki/issued/server.crt
key pki/private/server.key

cipher AES-256-GCM
auth SHA512
dh pki/dh.pem

server 10.250.70.0 255.255.255.0
route 10.250.71.0 255.255.255.0
ifconfig-pool-persist pki/ipp.txt

push "dhcp-option DNS 8.8.8.8"
push "dhcp-option DNS 1.0.0.1"

keepalive 10 120
max-clients 20

persist-key
persist-tun

log /var/log/openvpn/openvpn.log
status /var/log/openvpn/openvpn-status.log
verb 4
topology subnet

client-config-dir /etc/openvpn/staticclients
data-ciphers AES-256-GCM:AES-192-GCM:AES-128-GCM

user nobody
group nogroup

explicit-exit-notify 1
crl-verify pki/crl.pem

# 2FA authentication stays disabled for the build-baseline environment.
# QR and Secret generation are exercised by OpenVPN-UI without enabling login enforcement.
