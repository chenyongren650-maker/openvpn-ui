<!-- User Account Menu -->
<li class="dropdown user user-menu {{if compare .RouterPattern "/profile"}}nav-item{{end}}">
  <!-- Menu Toggle Button -->
  <a href="#" class="nav-link dropdown-toggle" data-toggle="dropdown">
    <!-- The user image in the navbar-->
    <img src="/static/img/person.png" class="user-image" alt="{{t .Localizer "common.user_image"}}">
    <!-- hidden-xs hides the username on small devices so only the image appears. -->
    <span class="hidden-xs">{{ .Userinfo.Name}}</span>
  </a>
  <ul class="dropdown-menu">
    <!-- The user image in the menu -->
    <li class="user-header">
      <img src="/static/img/person.png" class="img-circle" alt="{{t .Localizer "common.user_image"}}">
      <p>
        {{ .Userinfo.Name}}
        <small>{{t .Localizer "profile.created_on" (.Userinfo.Created.Format "2006-01-02 15:04:05")}}</small>
      </p>
    </li>

    <!-- Menu Footer-->
    <li class="user-footer">
      <div class="pull-left">
        <a href="{{urlfor "ProfileController.Get"}}" class="btn btn-default btn-flat">{{t .Localizer "profile.configuration"}}</a>
      </div>
      <div class="pull-right">
        <a href="{{urlfor "LoginController.Logout"}}" class="btn btn-default btn-flat">{{t .Localizer "login.sign_out"}}</a>
      </div>
    </li>
  </ul>
</li>
