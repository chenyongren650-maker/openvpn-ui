{{ template "layout/base.html" . }}

{{define "head"}}
<title>{{t .Localizer "settings.title"}}</title>
{{end}}

{{define "body"}}
<div class="card card-default">
  <div class="card-header with-border">
    <h3 class="card-title">{{t .Localizer "settings.heading"}}</h3>
    <div class="pull-right card-tools">
      <button type="button" class="btn btn-tool" data-card-widget="collapse">
        <i class="fa fa-minus"></i></button>
    </div>
  </div>
  <!-- /.card-header -->
  <!-- form start -->
  <div class="card-body">
  {{template "common/alert.html" .}}
  <form role="form" action="{{urlfor "SettingsController.Login"}}" method="post">
    <div class="card-body">
      <!-- Disabled Profile - yet another feature to implement.
      <div class="form-group">
        <label for="name">Profile</label>
        <input type="text" class="form-control" id="Profile" disabled
          value=" {{ .Settings.Profile }} ">
      </div>
      Disabled profile -->
      <div class="form-group">
        <label class="col-form-label" for="MIAddress">{{t .Localizer "settings.management_address"}}</label>
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-gear"></i></span>
          </div>
          <input type="text" class="form-control" id="MIAddress" title="{{t .Localizer "settings.management_address_help"}}" name="MIAddress" placeholder="openvpn:2080" value="{{ .Settings.MIAddress }}">
        </div>
      </div>

      <div class="form-group">
        <label class="col-form-label" for="MINetwork">{{t .Localizer "settings.management_protocol"}}</label>
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fa fa-exchange"></i></span>
          </div>
          <input type="text" class="form-control" id="MINetwork" title="{{t .Localizer "settings.management_protocol_help"}}" name="MINetwork" placeholder="tcp" value="{{ .Settings.MINetwork }}">
        </div>
      </div>

      <div class="form-group">
        <label class="col-form-label" for="OVConfigPath">{{t .Localizer "settings.openvpn_path"}}</label>
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-folder"></i></span>
          </div>
          <input type="text" class="form-control" id="OVConfigPath" name="OVConfigPath" title="{{t .Localizer "settings.openvpn_path_help"}}" placeholder="/etc/openvpn" value="{{ .Settings.OVConfigPath }}">
        </div>
      </div>

      <div class="form-group">
        <label class="col-form-label" for="EasyRSAPath">{{t .Localizer "settings.easyrsa_path"}}</label> <strong><span style="color:#337ab7" title="{{t .Localizer "common.new_format"}}">!</span></strong>
        <div class="input-group mb-3">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-folder"></i></span>
          </div>
          <input type="text" class="form-control" id="EasyRSAPath" name="EasyRSAPath" title="{{t .Localizer "settings.easyrsa_path_help"}}" placeholder="/usr/share/easy-rsa" value="{{ .Settings.EasyRSAPath }}">
        </div>
      </div>

      {{ .xsrfdata }}

      <button type="submit" class="btn btn-primary" style="width: 125px;">{{t .Localizer "common.save_config"}}</button>
    </div>
        <!-- /.card-body -->
  </form>
</div>  
</div>
<!-- /.card -->
{{end}}
